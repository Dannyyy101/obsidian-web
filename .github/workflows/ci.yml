# Typecheck, Lint, Tests, Build und E2E-Tests bei jedem Pull Request. Auf main läuft nur noch der
# Docker-Build, die Tests sind dort schon im PR gelaufen.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          # Wie im Dockerfile; server/prod.ts braucht Node mit TypeScript-Unterstützung.
          node-version: 24
          cache: pnpm

      # remotely-save wird per postinstall von GitHub-Releases geladen; der Cache spart den Download.
      - uses: actions/cache@v4
        with:
          path: public/bundled-plugins
          key: bundled-plugins-${{ hashFiles('scripts/fetch-plugins.mjs') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec vite build

      # Ohne bundled-plugins: remotely-save steht teils unter PolyForm Strict und darf nicht weitergegeben werden.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            !dist/bundled-plugins
          retention-days: 7

  # Ein Job pro Browser, damit sie parallel laufen und jeder nur seinen Browser installiert.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: public/bundled-plugins
          key: bundled-plugins-${{ hashFiles('scripts/fetch-plugins.mjs') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7
